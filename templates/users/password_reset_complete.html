{% extends "users/basic.html" %}

{% block title %}Password Reset Complete | BookMySeat{% endblock %}

{% block content %}

<section class="reset-complete-page">
  <div class="reset-complete-shell">
    <div class="reset-complete-card">
      <div class="status-icon" aria-hidden="true">
        <i class="fas fa-check"></i>
      </div>

      <span class="section-kicker">Password updated</span>
      <h1>Password Reset Complete</h1>
      <p>
        Your password has been successfully reset. You can now sign in with your new password.
      </p>

      <div class="reset-actions">
        <a href="{% url 'login' %}" class="primary-action">
          <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
          Login
        </a>
        <a href="{% url 'movie_list' %}" class="secondary-action">
          Browse Movies
          <i class="fas fa-chevron-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </div>
</section>

<style>
  .reset-complete-page {
    display: flex;
    align-items: center;
    min-height: 560px;
    padding: 56px 0 34px;
  }

  .reset-complete-shell {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  .reset-complete-card {
    position: relative;
    overflow: hidden;
    padding: 44px;
    border: 1px solid #e7ebf0;
    border-radius: 8px;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(247, 249, 252, 0.96)),
      url("https://images.unsplash.com/photo-1512149177596-f817c7ef5d4c?auto=format&fit=crop&w=1200&q=80");
    background-position: center;
    background-size: cover;
    box-shadow: 0 18px 48px rgba(23, 32, 51, 0.12);
    text-align: center;
  }

  .reset-complete-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.86);
  }

  .reset-complete-card > * {
    position: relative;
    z-index: 1;
  }

  .status-icon {
    width: 64px;
    height: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    border-radius: 50%;
    background: #eaf8f0;
    color: #16875f;
    font-size: 26px;
    box-shadow: 0 14px 28px rgba(22, 135, 95, 0.16);
  }

  .section-kicker {
    display: block;
    margin: 0 0 8px;
    color: #1c6f86;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .reset-complete-card h1 {
    margin: 0 0 12px;
    color: #172033;
    font-size: 36px;
    font-weight: 800;
    line-height: 1.12;
  }

  .reset-complete-card p {
    max-width: 520px;
    margin: 0 auto;
    color: #667085;
    font-size: 16px;
    line-height: 1.7;
  }

  .reset-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }

  .primary-action,
  .secondary-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 160px;
    min-height: 46px;
    padding: 0 18px;
    border-radius: 8px;
    font-weight: 800;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .primary-action {
    background: #16875f;
    color: #ffffff;
  }

  .primary-action:hover,
  .primary-action:focus {
    background: #126f4e;
    color: #ffffff;
    text-decoration: none;
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(22, 135, 95, 0.24);
  }

  .secondary-action {
    border: 1px solid #d9e0e8;
    background: #ffffff;
    color: #172033;
  }

  .secondary-action:hover,
  .secondary-action:focus {
    border-color: #1c6f86;
    background: #eef8fb;
    color: #1c6f86;
    text-decoration: none;
  }

  @media (max-width: 576px) {
    .reset-complete-page {
      min-height: 500px;
      padding-top: 32px;
    }

    .reset-complete-card {
      padding: 28px 22px;
    }

    .reset-complete-card h1 {
      font-size: 30px;
    }

    .reset-actions {
      flex-direction: column;
    }

    .primary-action,
    .secondary-action {
      width: 100%;
    }
  }
</style>

{% endblock %}
